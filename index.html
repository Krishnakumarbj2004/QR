<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827">
<title>Visitor QR — Laptop Scanner</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{color-scheme:light;--ink:#111827;--muted:#64748b;--blue:#1d4ed8}*{box-sizing:border-box}body{margin:0;padding:24px;background:#f1f5f9;color:var(--ink);font:16px/1.45 Arial,sans-serif}.wrap{max-width:760px;margin:20px auto;background:#fff;padding:26px;border-radius:18px;box-shadow:0 8px 30px #0f172a12}h1{margin:0 0 6px;font-size:27px}.muted{color:var(--muted)}label{display:block;margin:16px 0 6px;font-weight:700}input,select{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:9px;font-size:16px}button{border:0;border-radius:9px;padding:13px 17px;background:var(--blue);color:#fff;font-size:15px;font-weight:700;cursor:pointer}button.secondary{background:#334155}button:disabled{opacity:.55;cursor:wait}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.actions button{flex:1;min-width:150px}.hidden{display:none!important}#reader{width:100%;max-width:620px;margin:18px auto}#reader video{border-radius:12px}.panel{margin-top:18px;padding:18px;border-radius:13px}.valid{background:#dcfce7;color:#14532d}.duplicate{background:#fef3c7;color:#78350f}.invalid{background:#fee2e2;color:#7f1d1d}.error{background:#e2e8f0;color:#1e293b}.panel h2{margin:0 0 8px}.name{font-size:21px;font-weight:700;margin:8px 0}#message{min-height:24px;margin-top:12px;color:var(--muted)}.note{font-size:13px;color:var(--muted)}@media(max-width:600px){body{padding:10px}.wrap{padding:18px;margin:5px auto}}
</style></head>
<body><main class="wrap">
<h1>Visitor Entry — Laptop Scanner</h1><p class="muted">Reception webcam scanner. This page must be served over HTTPS.</p>
<section id="loginPanel"><label for="staffCode">Staff access code</label><input id="staffCode" type="password" autocomplete="off" placeholder="Enter your 32-character staff code"><div class="actions"><button id="loginBtn" onclick="login()">Sign in</button></div><p id="loginMessage" role="status"></p></section>
<section id="scannerPanel" class="hidden"><p id="signedInAs" class="muted"></p><label for="cameraSelect">Select laptop camera</label><select id="cameraSelect"></select><div class="actions"><button id="startBtn" onclick="startCamera()">Start camera</button><button class="secondary" onclick="stopCamera()">Stop camera</button></div><div id="reader"></div><p id="message" role="status">Camera is stopped.</p><section id="result" class="panel hidden" aria-live="polite"></section><div class="actions"><button id="nextBtn" class="hidden" onclick="scanNext()">Scan next visitor</button><button class="secondary" onclick="logout()">Sign out</button></div><p class="note">If no webcam appears, allow camera access in your browser's address-bar permissions and reload this page.</p></section>
</main>
<script>
// Replace with your deployed Apps Script Web App URL, ending in /exec.
const API_URL='https://script.google.com/macros/s/AKfycbwjjmT_kJjLRkcH6MFRK9OShJ9p8dpqjmGp2c3OXHiM7pFeFjwsatzrKmOyx3_OZ1RP/exec';
const SESSION_KEY='visitor_qr_laptop_session_v1',STAFF_KEY='visitor_qr_laptop_staff_v1';
let scanner=null,cameraRunning=false,processing=false,callbackCounter=0;
const $=id=>document.getElementById(id);
const validApi=()=>/^https:\/\/script\.google\.com\/macros\/s\//.test(API_URL)&&/\/exec$/.test(API_URL);
function jsonp(action,params={}){return new Promise((resolve,reject)=>{if(!validApi())return reject(new Error('Set API_URL in index.html to your Apps Script /exec URL.'));const cb='visitorQrCallback_'+Date.now()+'_'+(++callbackCounter),q=new URLSearchParams({api:action,callback:cb,...params}),script=document.createElement('script');let done=false;const cleanup=()=>{if(done)return;done=true;clearTimeout(timer);script.remove();try{delete window[cb]}catch(_){window[cb]=undefined}};const timer=setTimeout(()=>{cleanup();reject(new Error('Server timed out. Check internet and retry.'))},25000);window[cb]=data=>{cleanup();resolve(data)};script.onerror=()=>{cleanup();reject(new Error('Could not contact Apps Script. Check the /exec URL and deployment access.'))};script.src=API_URL+(API_URL.includes('?')?'&':'?')+q.toString();document.body.appendChild(script)})}
async function login(){const code=$('staffCode').value.trim();if(!/^[a-f0-9]{32}$/i.test(code)){$('loginMessage').textContent='Enter the 32-character staff access code.';return}$('loginBtn').disabled=true;$('loginMessage').textContent='Signing in…';try{const d=await jsonp('login',{code});if(!d||!d.ok)throw new Error(d?.message||'Sign-in failed.');localStorage.setItem(SESSION_KEY,d.sessionToken);localStorage.setItem(STAFF_KEY,d.staffName);$('staffCode').value='';showScanner();await loadCameras()}catch(e){$('loginMessage').textContent=e.message}finally{$('loginBtn').disabled=false}}
function showScanner(){$('loginPanel').classList.add('hidden');$('scannerPanel').classList.remove('hidden');$('signedInAs').textContent='Signed in as '+(localStorage.getItem(STAFF_KEY)||'staff')}
async function loadCameras(){if(typeof Html5Qrcode==='undefined'){$('message').textContent='QR library did not load. Check internet access and reload.';return}try{const cams=await Html5Qrcode.getCameras(),sel=$('cameraSelect');sel.innerHTML='';cams.forEach((c,i)=>{const o=document.createElement('option');o.value=c.id;o.textContent=c.label||'Camera '+(i+1);sel.appendChild(o)});if(!cams.length)throw new Error('No camera found. Check that a webcam is connected.');const preferred=cams.find(c=>/integrated|built.?in|webcam|front/i.test(c.label||''));if(preferred)sel.value=preferred.id;$('message').textContent='Camera found. Click Start camera.'}catch(e){$('message').textContent=e.message||'Unable to access webcam. Allow camera permission and reload.'}}
async function startCamera(){if(cameraRunning||processing)return;const id=$('cameraSelect').value;if(!id){await loadCameras();return}if(!scanner)scanner=new Html5Qrcode('reader',{verbose:false});$('startBtn').disabled=true;$('message').textContent='Starting webcam…';try{await scanner.start(id,{fps:10,qrbox:{width:270,height:270},aspectRatio:1},txt=>onQrScanned(txt),()=>{});cameraRunning=true;$('message').textContent='Camera active. Hold a visitor QR code in front of the webcam.'}catch(e){$('message').textContent='Camera could not start: '+(e.message||e)+'. Check browser camera permission.'}finally{$('startBtn').disabled=false}}
async function stopCamera(){if(scanner&&cameraRunning){try{await scanner.stop()}catch(_){}cameraRunning=false}$('message').textContent='Camera stopped.'}
function extractToken(txt){const v=String(txt||'').trim(),m=v.match(/^v1:([a-f0-9]{64})$/i);if(m)return m[1].toLowerCase();try{const u=new URL(v),t=u.searchParams.get('t')||u.searchParams.get('token');if(t&&/^[a-f0-9]{64}$/i.test(t))return t.toLowerCase()}catch(_){}return null}
async function onQrScanned(txt){if(processing)return;processing=true;await stopCamera();$('message').textContent='QR detected. Verifying visitor…';$('result').classList.add('hidden');$('nextBtn').classList.add('hidden');const token=extractToken(txt);if(!token){showResult({status:'INVALID',message:'This QR is not a recognized visitor QR code.'});return}try{const s=localStorage.getItem(SESSION_KEY);if(!s)throw new Error('Staff session missing. Sign in again.');const d=await jsonp('checkin',{t:token,s});if(d?.status==='UNAUTHORIZED'){localStorage.removeItem(SESSION_KEY);localStorage.removeItem(STAFF_KEY);$('scannerPanel').classList.add('hidden');$('loginPanel').classList.remove('hidden');$('loginMessage').textContent='Staff session expired. Sign in again.';return}showResult(d)}catch(e){showResult({status:'ERROR',message:e.message||'Unable to verify. Retry this QR.'})}}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(v){return v?new Date(v).toLocaleString('en-IN',{timeZone:'Asia/Kolkata',dateStyle:'medium',timeStyle:'medium'}):'Not available'}
function showResult(d){const b=$('result'),s=d?.status||'ERROR',v=d?.visitor||{};b.className='panel';let h=s,body='';if(s==='VALID'){b.classList.add('valid');h='✓ VALID — ENTRY RECORDED';body='<div class="name">'+esc(v.name)+'</div><div>Visitor ID: <b>'+esc(v.visitorId)+'</b></div><p>Entry time: <b>'+esc(fmt(d.checkedInAt))+'</b></p>'}else if(s==='ALREADY_CHECKED_IN'){b.classList.add('duplicate');h='⚠ ALREADY CHECKED IN';body='<div class="name">'+esc(v.name)+'</div><div>Visitor ID: <b>'+esc(v.visitorId)+'</b></div><p>First entry: <b>'+esc(fmt(d.checkedInAt))+'</b></p>'}else if(s==='INVALID'){b.classList.add('invalid');h='✕ INVALID QR';body='<p>'+esc(d.message)+'</p>'}else{b.classList.add('error');h=esc(s);body='<p>'+esc(d?.message||'Unable to verify visitor.')+'</p>'}b.innerHTML='<h2>'+h+'</h2>'+body;b.classList.remove('hidden');$('nextBtn').classList.remove('hidden');$('message').textContent='Reception staff: '+(localStorage.getItem(STAFF_KEY)||'staff')}
async function scanNext(){processing=false;$('result').classList.add('hidden');$('nextBtn').classList.add('hidden');await startCamera()}
async function logout(){await stopCamera();const s=localStorage.getItem(SESSION_KEY);localStorage.removeItem(SESSION_KEY);localStorage.removeItem(STAFF_KEY);if(s){try{await jsonp('logout',{s})}catch(_){}}$('scannerPanel').classList.add('hidden');$('loginPanel').classList.remove('hidden');$('loginMessage').textContent='Signed out.';processing=false}
window.addEventListener('load',async()=>{if(!validApi()){$('loginMessage').textContent='Setup required: edit index.html and set API_URL to your Apps Script /exec URL.';return}const s=localStorage.getItem(SESSION_KEY);if(s){showScanner();await loadCameras()}});
</script></body></html>
